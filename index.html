<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Agendamento</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importação do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Agende seu Horário</h1>
            <p>Rápido, prático e sem filas.</p>
        </header>

        <form id="formAgendamento">
            <div class="input-group">
                <label for="nomeCliente">Seu Nome</label>
                <input type="text" id="nomeCliente" placeholder="Ex: João Silva" required>
            </div>

            <div class="input-group">
                <label for="servico">Serviço</label>
                <select id="servico" required>
                    <option value="" disabled selected>Escolha um serviço...</option>
                    <option value="Corte">Corte na Tesoura/Máquina</option>
                    <option value="Barba">Barboterapia</option>
                    <option value="Completo">Corte + Barba</option>
                </select>
            </div>

            <div class="input-group">
                <label for="data">Data</label>
                <input type="date" id="data" required>
            </div>

            <div class="input-group">
                <label>Horários Disponíveis</label>
                <div id="gridHorarios" class="grid-horarios">
                    <!-- Os botões de hora aparecerão aqui via JavaScript -->
                    <p class="aviso">Selecione uma data primeiro.</p>
                </div>
                <!-- Campo invisível para guardar a hora que o cliente clicar -->
                <input type="hidden" id="horaSelecionada" required>
            </div>

            <button type="submit" id="btnConfirmar" disabled>Confirmar Agendamento</button>
        </form>
        
        <div id="mensagem" class="mensagem oculto"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
